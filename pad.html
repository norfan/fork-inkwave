<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>INKWAVE — Phone Pad</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: linear-gradient(180deg, #16233a 0%, #0d1020 100%); color: #fff; font: 15px/1.3 'Segoe UI', system-ui, sans-serif; touch-action: none; }
  #rot { display: none; position: fixed; inset: 0; z-index: 99; background: #0d1020; color: #9fb; align-items: center; justify-content: center; font-size: 18px; text-align: center; padding: 24px; }
  #rot.on { display: flex; }
  #code-card { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; }
  #code-card .t { font: 900 30px/1.1 'Segoe UI', sans-serif; letter-spacing: 1px; color: #ff8a14; text-align: center; }
  #code-card .s { font-size: 14px; color: #8b92a8; text-align: center; max-width: 340px; }
  #code-card input { width: min(320px, 80vw); padding: 14px 16px; font: 900 26px/1 'Consolas', monospace; letter-spacing: 8px; text-align: center; text-transform: uppercase; background: #1a2230; color: #fff; border: 2px solid #33405a; border-radius: 12px; outline: none; }
  #code-card input:focus { border-color: #ff8a14; }
  #code-card button { width: min(320px, 80vw); padding: 14px; font: 800 18px/1 'Segoe UI', sans-serif; letter-spacing: 2px; background: #ff8a14; color: #10131f; border: 0; border-radius: 12px; }
  #code-card .err { color: #f87171; font-size: 13px; min-height: 18px; }
  #dl { width: min(320px, 80vw); padding: 12px 14px; font: 800 16px/1 'Segoe UI', sans-serif; letter-spacing: 1px; text-align: center; background: rgba(255,138,20,.16); color: #ffb45e; border: 2px solid #ff8a14; border-radius: 12px; text-decoration: none; display: none; }
  #dl.on { display: block; }
  #dl small { display: block; margin-top: 6px; font: 500 12px/1.3 'Segoe UI', sans-serif; color: #8b92a8; letter-spacing: 0; }
  #dl-bar { display: none; position: fixed; top: 44px; left: 0; right: 0; z-index: 21; margin: 0 auto; width: fit-content; max-width: 92vw; padding: 9px 16px; font: 800 13px/1 'Segoe UI', sans-serif; letter-spacing: 1px; text-align: center; background: rgba(255,138,20,.22); color: #ffd9a8; border: 1px solid rgba(255,138,20,.7); border-radius: 20px; text-decoration: none; }
  #dl-bar.on { display: block; }
  #status { position: fixed; top: 8px; left: 0; right: 0; z-index: 20; display: flex; justify-content: center; gap: 12px; font: 700 12px/1.2 'Segoe UI', sans-serif; letter-spacing: 1px; pointer-events: none; }
  #status b { background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 20px; white-space: nowrap; }
  #status .ok { color: #5ef29a; } #status .bad { color: #ffb454; } #status .seat { color: #7fd4ff; }
  .stick { position: absolute; width: 34vw; height: 34vw; max-width: 190px; max-height: 190px; border-radius: 50%; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.35); touch-action: none; }
  .stick::after { content: ''; position: absolute; left: 50%; top: 50%; width: 44%; height: 44%; border-radius: 50%; background: rgba(255,255,255,.32); transform: translate(-50%,-50%); pointer-events: none; }
  .stick .knob { position: absolute; left: 50%; top: 50%; width: 30%; height: 30%; border-radius: 50%; background: #ff8a14; box-shadow: 0 2px 10px rgba(0,0,0,.5); transform: translate(-50%,-50%); pointer-events: none; }
  /* left stick: movement, bottom-left (matches the classic pad layout) */
  #stickL { left: 5vw; bottom: 5vh; }
  /* right stick: aiming, stacked ABOVE the action diamond (both hug the right edge) */
  #stickR { right: 4vw; bottom: 58vh; width: 28vw; height: 28vw; max-width: 130px; max-height: 130px; }
  #stickR::after { background: rgba(127,212,255,.35); }
  #stickR .knob { background: #7fd4ff; }
  /* action diamond (layout mirrored from animal-world-cup's pad): jump top, sub left,
     special right, fire bottom (the big one), squid centre — hold-to-squid. Sits in the
     bottom-right corner; the aiming stick floats above it. */
  #pad { position: absolute; right: 4vw; bottom: 4vh; width: 44vw; height: 44vw; max-width: 190px; max-height: 190px; }
  #pad .btn { position: absolute; width: 29%; height: 29%; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,.10); border: 2px solid rgba(255,255,255,.38); color: #fff; font: 800 12px/1 'Segoe UI', system-ui, sans-serif; letter-spacing: 1px; touch-action: none; }
  #pad .btn:active, #pad .btn.on { background: rgba(255,138,20,.75); border-color: #ff8a14; }
  #btnJump { left: 37%; top: 0; }
  #btnSub { left: 0; top: 37%; }
  #btnSpecial { right: 0; top: 37%; }
  #pad #btnFire { left: 37%; bottom: 0; width: 32%; height: 32%; font-size: 15px; background: rgba(255,138,20,.28); border-color: rgba(255,138,20,.65); }
  #pad #btnSquid { left: 37%; top: 37%; width: 26%; height: 26%; background: rgba(0,0,0,.42); border-color: rgba(255,255,255,.3); }
  #btnMap { position: absolute; right: 4vw; top: 5vh; width: 11vw; height: 11vw; max-width: 66px; max-height: 66px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,.10); border: 2px solid rgba(255,255,255,.38); color: #fff; font: 800 12px/1 'Segoe UI', system-ui, sans-serif; letter-spacing: 1px; touch-action: none; }
  #btnMap:active, #btnMap.on { background: rgba(255,138,20,.75); border-color: #ff8a14; }
  @media (max-width: 760px) {
    #pad { max-width: 160px; max-height: 160px; }
    #stickL { max-width: 150px; max-height: 150px; }
    #stickR { max-width: 110px; max-height: 110px; }
    #btnMap { max-width: 54px; max-height: 54px; }
  }
  #hud { display: none; }
  #hud.on { display: block; }
</style>
</head>
<body>
<div id="rot">请横屏使用手柄 ↻</div>
<div id="code-card">
  <div class="t">INKWAVE · 手机手柄</div>
  <div class="s">请输入大屏 PHONE PAD 界面显示的 4 位房间号。</div>
  <a id="dl" href="/inkwave-pad.apk">⬇ 下载手柄 APP<small>免费 App · 免手动输入地址</small></a>
  <input id="code" maxlength="8" placeholder="房间号" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <button id="join">连接</button>
  <div class="err" id="err"></div>
</div>
<div id="hud">
  <div id="status"></div>
  <a id="dl-bar" href="/inkwave-pad.apk">⬇ 下载手柄 APP</a>
  <div id="stickL" class="stick"><div class="knob"></div></div>
  <div id="stickR" class="stick"><div class="knob"></div></div>
  <div id="pad">
    <div id="btnFire" class="btn">开火</div>
    <div id="btnJump" class="btn">跳跃</div>
    <div id="btnSub" class="btn">副武器</div>
    <div id="btnSpecial" class="btn">大招</div>
    <div id="btnSquid" class="btn">墨鱼</div>
  </div>
  <div id="btnMap" class="btn">地图</div>
</div>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const ROOM = new URLSearchParams(location.search).get('room') || '';
  // inside the Android pad app the URL carries ?apk=<version>; a plain browser (e.g. the one
  // opened by the pairing QR code) doesn't, so show the APK download entry there only.
  const IN_APP = !!new URLSearchParams(location.search).get('apk');
  const DEVICE_KEY = 'inkwave_pad_device';
  let device = ''; try { device = localStorage.getItem(DEVICE_KEY) || ''; } catch {}
  if (!device) { device = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); try { localStorage.setItem(DEVICE_KEY, device); } catch {} }
  const state = { lx: 0, ly: 0, ax: 0, ay: 0, fire: 0, jump: 0, sub: 0, special: 0, squid: 0, map: 0 };
  let ws = null, seat = 0, statusEl = null, errEl = null, retry = 0, retryT = null, curRoom = '';

  // ---- "you're in a browser, not the app yet" download entry ----
  if (!IN_APP) {
    const dl = $('dl'), dlBar = $('dl-bar');
    dl.classList.add('on');
    window.__padShowDownloadBar = () => dlBar.classList.add('on');   // join() surfaces it on the HUD
  }

  // ---- portrait guard ----
  const mq = window.matchMedia('(orientation: portrait)');
  const rot = $('rot');
  const applyRot = () => rot.classList.toggle('on', mq.matches);
  applyRot(); mq.addEventListener('change', applyRot);

  const status = (html, cls) => { if (statusEl) statusEl.innerHTML = '<b class="' + cls + '">' + html + '</b>'; };
  const padState = () => ({ lx: state.lx, ly: state.ly, ax: state.ax, ay: state.ay, fire: state.fire, jump: state.jump, sub: state.sub, special: state.special, squid: state.squid, map: state.map });

  function sendNow() {
    if (ws && ws.readyState === 1) ws.send('b|' + JSON.stringify({ t: 'padinput', device, d: padState() }));
  }

  // 30 Hz continuous stream; one-shot taps get an immediate frame so they're never dropped.
  setInterval(sendNow, 33);
  function tap() { sendNow(); }

  // ---- virtual sticks ----
  function makeStick(el, keyX, keyY) {
    const rect = () => el.getBoundingClientRect();
    const r = () => rect().width / 2;
    let pid = null, cx = 0, cy = 0;
    const apply = (x, y) => {
      const rr = r();
      let dx = x - cx, dy = y - cy;
      const m = Math.hypot(dx, dy);
      if (m > rr) { dx *= rr / m; dy *= rr / m; }
      const dz = 0.14;
      let nx = dx / rr, ny = dy / rr;
      const nm = Math.hypot(nx, ny);
      if (nm < dz) { nx = 0; ny = 0; }
      else { const k = (nm - dz) / (1 - dz); nx *= k / nm; ny *= k / nm; }
      state[keyX] = nx; state[keyY] = -ny;
      const k = el.querySelector('.knob'); k.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
      tap();
    };
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      pid = e.pointerId;
      const rc = rect(); cx = rc.left + rc.width / 2; cy = rc.top + rc.height / 2;
      apply(e.clientX, e.clientY);
    });
    el.addEventListener('pointermove', (e) => { if (e.pointerId === pid) { e.preventDefault(); apply(e.clientX, e.clientY); } });
    const up = (e) => {
      if (e.pointerId !== pid) return;
      pid = null;
      state[keyX] = 0; state[keyY] = 0;
      const k = el.querySelector('.knob'); k.style.transform = 'translate(-50%,-50%)';
      tap();
    };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  }
  makeStick($('stickL'), 'lx', 'ly');
  makeStick($('stickR'), 'ax', 'ay');

  // ---- buttons ----
  function makeBtn(el, key) {
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); state[key] = 1; el.classList.add('on'); tap(); });
    const up = (e) => { if (state[key] !== 1) return; state[key] = 0; el.classList.remove('on'); tap(); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  }
  makeBtn($('btnFire'), 'fire');
  makeBtn($('btnJump'), 'jump');
  makeBtn($('btnSub'), 'sub');
  makeBtn($('btnSpecial'), 'special');
  makeBtn($('btnSquid'), 'squid');
  makeBtn($('btnMap'), 'map');

  // ---- connection ----
  function connect(room) {
    if (ws) { try { ws.close(); } catch {} ws = null; }
    if (retryT) clearTimeout(retryT);
    curRoom = room;
    const url = 'ws://' + location.host + '/room/' + room + '?name=Phone&v=1';
    status('CONNECTING…', 'bad');
    let w;
    try { w = new WebSocket(url); } catch { return schedule(room); }
    ws = w;
    w.onmessage = (ev) => {
      const s = typeof ev.data === 'string' ? ev.data : '';
      if (s === 'pong') return;
      if (s.charCodeAt(0) === 109 && s.charCodeAt(1) === 124) {
        let o; try { o = JSON.parse(s.slice(s.indexOf('|', 2) + 1)); } catch { return; }
        return handle(o);
      }
      let o; try { o = JSON.parse(s); } catch { return; }
      handle(o);
    };
    w.onclose = () => { if (ws !== w) return; seat = 0; status('LOST — RECONNECTING', 'bad'); schedule(room); };
    w.onerror = () => { try { w.close(); } catch {} };
  }
  function schedule(room) {
    if (retryT) clearTimeout(retryT);
    retryT = setTimeout(() => connect(room), Math.min(5000, 800 * (++retry)), retry);
  }
  function handle(o) {
    if (o.t === 'err') { errEl.textContent = o.e || 'Connection failed'; return; }
    if (o.t === 'welcome') {
      retry = 0;
      try { ws.send('b|' + JSON.stringify({ t: 'padjoin', device, name: 'Phone' })); } catch {}
      status((seat ? 'PLAYER ' + seat + ' · ' : '') + curRoom + ' · READY', 'ok');
      return;
    }
    if (o.t === 'padseat') { seat = o.slot; status('PLAYER ' + seat + ' · READY', 'seat'); return; }
    if (o.t === 'lock') { status('PLAYER ' + seat + ' · LOCKED', 'seat'); return; }
  }

  function join() {
    const room = (ROOM || $('code').value || '').trim().toUpperCase();
    if (!room) { errEl.textContent = '请输入大屏显示的房间号。'; return; }
    errEl = $('err');
    statusEl = $('status');
    errEl.textContent = '';
    if (!IN_APP && window.__padShowDownloadBar) window.__padShowDownloadBar();
    $('code-card').style.display = 'none';
    $('hud').classList.add('on');
    connect(room);
  }
  $('join').addEventListener('click', join);
  $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });
  if (ROOM) join();
})();
</script>
</body>
</html>
